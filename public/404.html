<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Keçikoyun</title>
    <script>
      // GitHub Pages SPA: encode the URL path into sessionStorage and redirect to index.html
      var pathSegmentsToKeep = 1; // /kecikoyun/ base path has 1 segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
